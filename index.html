<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AhorroPro - Pareja & Suerte</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- PeerJS para conexión directa en tiempo real -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0B132B] text-slate-100 font-sans pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const initialPlans = [
      {
        id: 'plan-1',
        title: 'Ahorro Juntos 18K',
        targetAmount: 18300,
        frequency: 'semanal',
        totalPeriods: 60,
        partnerName: 'Pau 💕',
        steps: Array.from({ length: 60 }, (_, i) => {
          const num = i + 1;
          const amount = num * 10;
          return { 
            period: num, 
            amount, 
            isPaid: false, 
            paidBy: null,
            paidDate: null,
            receipt: null
          };
        })
      }
    ];

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const hostRoomId = urlParams.get('room');

      const [plans, setPlans] = useState(() => {
        const saved = localStorage.getItem('ahorro_plans');
        return saved ? JSON.parse(saved) : initialPlans;
      });

      const [selectedPlanId, setSelectedPlanId] = useState(plans[0]?.id || 'plan-1');
      const [activeTab, setActiveTab] = useState('grid');
      const [showRoulette, setShowRoulette] = useState(false);
      const [rouletteResult, setRouletteResult] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [showNewPlanModal, setShowNewPlanModal] = useState(false);
      const [showEditPlanModal, setShowEditPlanModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [copied, setCopied] = useState(false);
      const [isConnected, setIsConnected] = useState(false);

      const [selectedStepToPay, setSelectedStepToPay] = useState(null);
      const [activeReceiptStep, setActiveReceiptStep] = useState(null);

      // Formularios
      const [newTitle, setNewTitle] = useState('');
      const [newTarget, setNewTarget] = useState('10000');
      const [newPeriods, setNewPeriods] = useState('50');
      const [newFreq, setNewFreq] = useState('semanal');
      const [newPartner, setNewPartner] = useState('Pau 💕');

      const [editTitle, setEditTitle] = useState('');
      const [editTarget, setEditTarget] = useState('');
      const [editPeriods, setEditPeriods] = useState('');
      const [editFreq, setEditFreq] = useState('semanal');
      const [editPartner, setEditPartner] = useState('');

      const peerRef = useRef(null);
      const connRef = useRef(null);
      const myPeerIdRef = useRef('');

      // Inicialización de conexión directa P2P (PeerJS)
      useEffect(() => {
        const peer = new Peer();
        peerRef.current = peer;

        peer.on('open', (id) => {
          myPeerIdRef.current = id;
          // Si entramos con un link que tiene ?room=ID, nos conectamos a la pareja
          if (hostRoomId) {
            const conn = peer.connect(hostRoomId);
            connRef.current = conn;
            setupConnection(conn);
          }
        });

        // Escuchar conexiones entrantes (cuando la pareja abre nuestro link)
        peer.on('connection', (conn) => {
          connRef.current = conn;
          setupConnection(conn);
          // Enviar inmediatamente las metas actuales a la persona que se conectó
          setTimeout(() => {
            conn.send({ type: 'SYNC_PLANS', plans });
          }, 800);
        });

        return () => peer.destroy();
      }, []);

      const setupConnection = (conn) => {
        conn.on('open', () => {
          setIsConnected(true);
        });

        conn.on('data', (data) => {
          if (data.type === 'SYNC_PLANS') {
            setPlans(data.plans);
            localStorage.setItem('ahorro_plans', JSON.stringify(data.plans));
          }
        });

        conn.on('close', () => {
          setIsConnected(false);
        });
      };

      // Guardar localmente y transmitir a la pareja si están conectados
      const syncPlans = (newPlans) => {
        setPlans(newPlans);
        localStorage.setItem('ahorro_plans', JSON.stringify(newPlans));
        if (connRef.current && connRef.current.open) {
          connRef.current.send({ type: 'SYNC_PLANS', plans: newPlans });
        }
      };

      const plan = plans.find(p => p.id === selectedPlanId) || plans[0];
      const paidSteps = plan ? plan.steps.filter(s => s.isPaid) : [];
      const saved = paidSteps.reduce((acc, s) => acc + s.amount, 0);
      const progress = plan ? ((saved / plan.targetAmount) * 100).toFixed(1) : 0;

      const myTotal = paidSteps.filter(s => s.paidBy === 'Yo').reduce((acc, s) => acc + s.amount, 0);
      const partnerTotal = paidSteps.filter(s => s.paidBy === plan?.partnerName).reduce((acc, s) => acc + s.amount, 0);

      const handleOpenEdit = () => {
        if (!plan) return;
        setEditTitle(plan.title);
        setEditTarget(plan.targetAmount.toString());
        setEditPeriods(plan.totalPeriods.toString());
        setEditFreq(plan.frequency);
        setEditPartner(plan.partnerName);
        setShowEditPlanModal(true);
      };

      const handleStepClick = (step) => {
        if (step.isPaid) {
          togglePaid(step.period, false, null, null);
        } else {
          setSelectedStepToPay(step);
        }
      };

      const togglePaid = (periodNum, isPaidStatus, paidByPayer, receiptData = null) => {
        const currentDate = new Date().toLocaleDateString();
        const updatedSteps = plan.steps.map(s => {
          if (s.period === periodNum) {
            return { 
              ...s, 
              isPaid: isPaidStatus, 
              paidBy: isPaidStatus ? paidByPayer : null,
              paidDate: isPaidStatus ? currentDate : null,
              receipt: isPaidStatus ? (receiptData !== null ? receiptData : s.receipt) : null
            };
          }
          return s;
        });
        const updatedPlans = plans.map(p => p.id === plan.id ? { ...p, steps: updatedSteps } : p);
        syncPlans(updatedPlans);
      };

      const confirmPayerForStep = (payer) => {
        if (!selectedStepToPay) return;
        togglePaid(selectedStepToPay.period, true, payer, null);
        setSelectedStepToPay(null);
      };

      const markRoulettePaid = (payer) => {
        if (!rouletteResult) return;
        togglePaid(rouletteResult.period, true, payer, null);
        setShowRoulette(false);
        setRouletteResult(null);
      };

      const handleImageUpload = (e, periodNum) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64String = reader.result;
          const updatedSteps = plan.steps.map(s => {
            if (s.period === periodNum) {
              return { ...s, receipt: base64String };
            }
            return s;
          });
          const updatedPlans = plans.map(p => p.id === plan.id ? { ...p, steps: updatedSteps } : p);
          syncPlans(updatedPlans);
          if (activeReceiptStep && activeReceiptStep.period === periodNum) {
            setActiveReceiptStep({ ...activeReceiptStep, receipt: base64String });
          }
        };
        reader.readAsDataURL(file);
      };

      const generateShareLink = () => {
        const shareId = myPeerIdRef.current;
        if (!shareId) return;
        
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${shareId}`;
        navigator.clipboard.writeText(shareUrl);
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
      };

      const handleCreatePlan = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        const periods = parseInt(newPeriods) || 30;
        const target = parseFloat(newTarget) || 5000;
        const baseStep = (target * 2) / (periods * (periods + 1));
        
        const steps = Array.from({ length: periods }, (_, i) => {
          const num = i + 1;
          const calculated = Math.round(baseStep * num / 5) * 5;
          return {
            period: num,
            amount: calculated > 0 ? calculated : 10,
            isPaid: false,
            paidBy: null,
            paidDate: null,
            receipt: null
          };
        });

        const newPlan = {
          id: 'plan-' + Date.now(),
          title: newTitle,
          targetAmount: target,
          frequency: newFreq,
          totalPeriods: periods,
          partnerName: newPartner || 'Pau 💕',
          steps: steps
        };

        const updatedPlans = [...plans, newPlan];
        syncPlans(updatedPlans);
        setSelectedPlanId(newPlan.id);
        setShowNewPlanModal(false);
        setNewTitle('');
      };

      const handleSaveEditPlan = (e) => {
        e.preventDefault();
        if (!editTitle.trim()) return;

        const periods = parseInt(editPeriods) || 30;
        const target = parseFloat(editTarget) || 5000;
        const baseStep = (target * 2) / (periods * (periods + 1));

        const updatedSteps = Array.from({ length: periods }, (_, i) => {
          const num = i + 1;
          const existingStep = plan.steps.find(s => s.period === num);
          const calculated = Math.round(baseStep * num / 5) * 5;
          const newAmount = calculated > 0 ? calculated : 10;

          return {
            period: num,
            amount: existingStep ? existingStep.amount : newAmount,
            isPaid: existingStep ? existingStep.isPaid : false,
            paidBy: existingStep ? existingStep.paidBy : null,
            paidDate: existingStep ? existingStep.paidDate : null,
            receipt: existingStep ? existingStep.receipt : null
          };
        });

        const updatedPlans = plans.map(p => {
          if (p.id === plan.id) {
            return {
              ...p,
              title: editTitle,
              targetAmount: target,
              totalPeriods: periods,
              frequency: editFreq,
              partnerName: editPartner,
              steps: updatedSteps
            };
          }
          return p;
        });

        syncPlans(updatedPlans);
        setShowEditPlanModal(false);
      };

      const spinRoulette = () => {
        const available = plan.steps.filter(s => !s.isPaid);
        if (available.length === 0) return;
        setIsSpinning(true);
        let counter = 0;
        const interval = setInterval(() => {
          const rand = available[Math.floor(Math.random() * available.length)];
          setRouletteResult(rand);
          counter++;
          if (counter > 15) {
            clearInterval(interval);
            setIsSpinning(false);
          }
        }, 100);
      };

      return (
        <div className="max-w-4xl mx-auto px-4 pt-6 space-y-6">
          {/* Header */}
          <header className="flex justify-between items-center bg-[#1C2541] p-5 rounded-2xl border border-slate-700 shadow-xl flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-[#48E5C2] flex items-center justify-center text-[#0B132B] font-black text-xl">
                $
              </div>
              <div>
                <h1 className="text-xl font-extrabold text-white">Ahorro<span className="text-[#48E5C2]">Pro</span></h1>
                <p className="text-xs text-slate-400">Pareja & Tiempo Real ⚡</p>
              </div>
            </div>
            
            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowShareModal(true)}
                className="px-3.5 py-2 rounded-xl bg-[#FFD166]/20 text-[#FFD166] border border-[#FFD166]/40 font-bold text-xs hover:bg-[#FFD166]/30 transition flex items-center gap-1.5"
              >
                🔗 Invitar Pareja
              </button>

              <span className={`px-3 py-1.5 rounded-full text-xs font-bold border ${
                isConnected 
                  ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' 
                  : 'bg-slate-800 text-slate-400 border-slate-700'
              }`}>
                {isConnected ? '🟢 Conectados' : '⚪ Modo Solo'}
              </span>
            </div>
          </header>

          {/* Selector de Metas */}
          <div className="flex items-center justify-between gap-3 bg-[#1C2541]/60 p-3 rounded-2xl border border-slate-800 flex-wrap">
            <div className="flex items-center gap-2 overflow-x-auto pb-1 max-w-full">
              <span className="text-xs font-bold text-slate-400 whitespace-nowrap">Tus Metas:</span>
              {plans.map(p => (
                <button
                  key={p.id}
                  onClick={() => setSelectedPlanId(p.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                    p.id === selectedPlanId
                      ? 'bg-[#48E5C2] text-[#0B132B] shadow-md'
                      : 'bg-[#0B132B] text-slate-300 border border-slate-700 hover:border-slate-500'
                  }`}
                >
                  {p.title}
                </button>
              ))}
            </div>
            <button
              onClick={() => setShowNewPlanModal(true)}
              className="px-3.5 py-2 rounded-xl bg-[#48E5C2]/20 text-[#48E5C2] border border-[#48E5C2]/40 font-bold text-xs hover:bg-[#48E5C2]/30 transition"
            >
              + Nueva Meta
            </button>
          </div>

          {/* Tarjeta de Meta Principal */}
          {plan && (
            <div className="bg-[#1C2541] p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-4">
              <div className="flex justify-between items-center flex-wrap gap-2">
                <div>
                  <div className="flex items-center gap-2">
                    <h2 className="text-2xl font-black text-white">{plan.title}</h2>
                    <button
                      onClick={handleOpenEdit}
                      className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs transition"
                      title="Editar esta meta"
                    >
                      ✏️ Editar
                    </button>
                  </div>
                  <p className="text-xs text-slate-400 mt-0.5">Reto progresivo ({plan.frequency}) de {plan.totalPeriods} periodos</p>
                </div>
                <button 
                  onClick={() => { setShowRoulette(true); setRouletteResult(null); }}
                  className="px-4 py-2.5 rounded-xl bg-[#FFD166] text-[#0B132B] font-extrabold text-xs flex items-center gap-2 shadow-lg hover:scale-105 transition"
                >
                  🎲 ¡Girar Ruleta!
                </button>
              </div>

              {/* Barra de Progreso */}
              <div className="w-full bg-[#0B132B] h-3 rounded-full overflow-hidden border border-slate-800">
                <div 
                  className="bg-gradient-to-r from-[#48E5C2] to-[#FFD166] h-full transition-all duration-500" 
                  style={{ width: `${Math.min(progress, 100)}%` }}
                ></div>
              </div>

              {/* Métricas Generales */}
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-1">
                <div className="bg-[#0B132B] p-3 rounded-2xl border border-slate-800">
                  <p className="text-[11px] text-slate-400">Total Ahorrado</p>
                  <p className="text-xl font-black text-[#48E5C2]">${saved.toLocaleString()}</p>
                </div>
                <div className="bg-[#0B132B] p-3 rounded-2xl border border-slate-800">
                  <p className="text-[11px] text-slate-400">Meta Objetiva</p>
                  <p className="text-xl font-black text-white">${plan.targetAmount.toLocaleString()}</p>
                </div>
                <div className="bg-[#0B132B] p-3 rounded-2xl border border-slate-800 col-span-2 sm:col-span-1">
                  <p className="text-[11px] text-slate-400">Progreso Total</p>
                  <p className="text-xl font-black text-[#FFD166]">{progress}%</p>
                </div>
              </div>

              {/* Desglose Individual */}
              <div className="pt-2 border-t border-slate-800">
                <p className="text-xs font-bold text-slate-300 mb-2">Aportes por Integrante:</p>
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-[#0B132B]/60 p-3 rounded-xl border border-cyan-500/20">
                    <span className="text-[10px] text-cyan-400 font-bold uppercase">Yo</span>
                    <p className="text-lg font-black text-white">${myTotal.toLocaleString()}</p>
                  </div>
                  <div className="bg-[#0B132B]/60 p-3 rounded-xl border border-pink-500/20">
                    <span className="text-[10px] text-pink-400 font-bold uppercase">{plan.partnerName}</span>
                    <p className="text-lg font-black text-white">${partnerTotal.toLocaleString()}</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Pestañas de Navegación */}
          {plan && (
            <div className="flex gap-2 border-b border-slate-800 pb-2">
              <button
                onClick={() => setActiveTab('grid')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                  activeTab === 'grid'
                    ? 'bg-[#1C2541] text-[#48E5C2] border border-slate-700 shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                📅 Calendario de Aportes
              </button>
              <button
                onClick={() => setActiveTab('history')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                  activeTab === 'history'
                    ? 'bg-[#1C2541] text-[#FFD166] border border-slate-700 shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                📜 Historial de Transacciones ({paidSteps.length})
              </button>
            </div>
          )}

          {/* Vista 1: Grilla de Pasos */}
          {plan && activeTab === 'grid' && (
            <div className="space-y-3">
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                {plan.steps.map(step => (
                  <div 
                    key={step.period}
                    onClick={() => handleStepClick(step)}
                    className={`p-3.5 rounded-2xl border transition cursor-pointer flex flex-col justify-between ${
                      step.isPaid 
                        ? 'bg-emerald-950/30 border-emerald-500/50 text-emerald-300' 
                        : 'bg-[#1C2541] border-slate-700 hover:border-[#48E5C2]'
                    }`}
                  >
                    <div className="flex justify-between items-center text-xs font-bold">
                      <span>#{step.period}</span>
                      <span>{step.isPaid ? '✓' : '○'}</span>
                    </div>
                    <p className="text-lg font-black my-2 text-white">${step.amount.toLocaleString()}</p>
                    <div className="flex justify-between items-center text-[10px] text-slate-400 mt-1">
                      <span>{step.isPaid ? `Pagado (${step.paidBy})` : 'Toca para marcar'}</span>
                      {step.isPaid && step.receipt && <span className="text-[#48E5C2] font-bold">📷 View</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Vista 2: Historial Detallado */}
          {plan && activeTab === 'history' && (
            <div className="bg-[#1C2541] p-5 rounded-3xl border border-slate-700 space-y-3 shadow-xl">
              <h3 className="text-sm font-bold text-white mb-2">Registro Cronológico de Pagos</h3>
              {paidSteps.length === 0 ? (
                <p className="text-xs text-slate-400 py-6 text-center">Aún no hay aportes registrados en esta meta.</p>
              ) : (
                <div className="space-y-2">
                  {paidSteps.slice().reverse().map(step => (
                    <div key={step.period} className="flex justify-between items-center bg-[#0B132B] p-3.5 rounded-2xl border border-slate-800 text-xs flex-wrap gap-3">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-black">
                          ✓
                        </div>
                        <div>
                          <p className="font-extrabold text-white">Casilla #{step.period} - ${step.amount.toLocaleString()}</p>
                          <p className="text-[10px] text-slate-400">Pagado por <span className="text-[#48E5C2] font-bold">{step.paidBy}</span> {step.paidDate ? `el ${step.paidDate}` : ''}</p>
                        </div>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setActiveReceiptStep(step)}
                          className={`px-3 py-1.5 rounded-xl font-bold text-xs transition border ${
                            step.receipt 
                              ? 'bg-[#48E5C2]/20 text-[#48E5C2] border-[#48E5C2]/40 hover:bg-[#48E5C2]/30' 
                              : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                          }`}
                        >
                          {step.receipt ? '📷 View (Con Foto)' : '📷 View'}
                        </button>

                        <button
                          onClick={() => togglePaid(step.period, false, null, null)}
                          className="px-2.5 py-1.5 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 font-bold transition text-[10px]"
                          title="Desmarcar pago"
                        >
                          Deshacer
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Modal Compartir Link */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 bg-[#0B132B]/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1C2541] border border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl space-y-4">
                <button 
                  onClick={() => setShowShareModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div className="text-3xl">🔗</div>
                <h3 className="text-xl font-black text-white">Conectar con Tu Pareja</h3>
                <p className="text-xs text-slate-300">Genera el enlace. Cuando Pau lo abra en su teléfono, sus pantallas se conectarán automáticamente en tiempo real.</p>

                <button 
                  onClick={generateShareLink}
                  className="w-full py-3 rounded-xl bg-[#FFD166] text-[#0B132B] font-black text-xs hover:opacity-90 transition"
                >
                  {copied ? '✓ ¡Enlace Copiado al Portapapeles!' : 'Copiar Enlace Directo 📋'}
                </button>
              </div>
            </div>
          )}

          {/* Modal Ver/Subir Comprobante */}
          {activeReceiptStep && (
            <div className="fixed inset-0 z-50 bg-[#0B132B]/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1C2541] border border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl space-y-4">
                <button 
                  onClick={() => setActiveReceiptStep(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div>
                  <span className="text-[10px] font-bold uppercase text-[#48E5C2]">Comprobante de Pago</span>
                  <h3 className="text-xl font-black text-white mt-0.5">Casilla #{activeReceiptStep.period} (${activeReceiptStep.amount.toLocaleString()})</h3>
                  <p className="text-xs text-slate-400">Aportado por {activeReceiptStep.paidBy}</p>
                </div>

                <div className="bg-[#0B132B] border border-slate-800 rounded-2xl p-3 min-h-[160px] flex flex-col justify-center items-center overflow-hidden">
                  {activeReceiptStep.receipt ? (
                    <div className="space-y-3 w-full">
                      <img 
                        src={activeReceiptStep.receipt} 
                        alt="Comprobante" 
                        className="max-h-48 rounded-xl mx-auto object-contain border border-slate-700" 
                      />
                      <label className="inline-block px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl cursor-pointer transition border border-slate-700">
                        Cambiar foto
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={(e) => handleImageUpload(e, activeReceiptStep.period)} 
                          className="hidden" 
                        />
                      </label>
                    </div>
                  ) : (
                    <div className="space-y-3 py-4">
                      <p className="text-xs text-slate-400">No hay comprobante adjunto todavía.</p>
                      <label className="inline-block px-4 py-2.5 bg-[#48E5C2] text-[#0B132B] text-xs font-black rounded-xl cursor-pointer shadow-md hover:opacity-90 transition">
                        Subir Comprobante 📁
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={(e) => handleImageUpload(e, activeReceiptStep.period)} 
                          className="hidden" 
                        />
                      </label>
                    </div>
                  )}
                </div>

                <button 
                  onClick={() => setActiveReceiptStep(null)}
                  className="w-full py-2.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-xs hover:bg-slate-700 transition"
                >
                  Cerrar
                </button>
              </div>
            </div>
          )}

          {/* Modal Selección de Pagador */}
          {selectedStepToPay && (
            <div className="fixed inset-0 z-50 bg-[#0B132B]/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1C2541] border border-slate-700 rounded-3xl p-6 max-w-xs w-full text-center relative shadow-2xl space-y-4">
                <button 
                  onClick={() => setSelectedStepToPay(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div>
                  <span className="text-[10px] font-bold uppercase text-[#48E5C2]">Marcar Número #{selectedStepToPay.period}</span>
                  <p className="text-2xl font-black text-white mt-1">${selectedStepToPay.amount.toLocaleString()}</p>
                  <p className="text-xs text-slate-300 mt-2">¿Quién aporta esta cantidad?</p>
                </div>

                <div className="grid grid-cols-1 gap-2 pt-2">
                  <button 
                    onClick={() => confirmPayerForStep('Yo')}
                    className="py-3 rounded-xl bg-[#48E5C2] text-[#0B132B] font-extrabold text-xs hover:opacity-90 transition"
                  >
                    Lo Pago Yo 🙋‍♂️
                  </button>
                  <button 
                    onClick={() => confirmPayerForStep(plan.partnerName)}
                    className="py-3 rounded-xl bg-pink-400 text-[#0B132B] font-extrabold text-xs hover:opacity-90 transition"
                  >
                    {plan.partnerName} 💖
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Crear Nueva Meta */}
          {showNewPlanModal && (
            <div className="fixed inset-0 z-50 bg-[#0B132B]/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1C2541] border border-slate-700 rounded-3xl p-6 max-w-md w-full relative shadow-2xl">
                <button 
                  onClick={() => setShowNewPlanModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <h3 className="text-xl font-black text-white mb-4">🎯 Crear Nueva Meta de Ahorro</h3>
                <form onSubmit={handleCreatePlan} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-1 font-bold">Nombre de la Meta</label>
                    <input 
                      type="text" 
                      placeholder="Ej. Viaje a Tijuana 🏖️" 
                      value={newTitle}
                      onChange={e => setNewTitle(e.target.value)}
                      required
                      className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Monto Meta ($)</label>
                      <input 
                        type="number" 
                        value={newTarget}
                        onChange={e => setNewTarget(e.target.value)}
                        required
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Cantidad de Pasos</label>
                      <input 
                        type="number" 
                        value={newPeriods}
                        onChange={e => setNewPeriods(e.target.value)}
                        required
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Frecuencia</label>
                      <select 
                        value={newFreq}
                        onChange={e => setNewFreq(e.target.value)}
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      >
                        <option value="diario">Diaria</option>
                        <option value="semanal">Semanal</option>
                        <option value="quincenal">Quincenal</option>
                        <option value="mensual">Mensual</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Nombre Pareja</label>
                      <input 
                        type="text" 
                        value={newPartner}
                        onChange={e => setNewPartner(e.target.value)}
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      />
                    </div>
                  </div>
                  <button 
                    type="submit"
                    className="w-full py-3 rounded-xl bg-[#48E5C2] text-[#0B132B] font-black text-xs hover:opacity-90 transition mt-2"
                  >
                    ¡Guardar y Comenzar Meta!
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Editar Meta */}
          {showEditPlanModal && (
            <div className="fixed inset-0 z-50 bg-[#0B132B]/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1C2541] border border-slate-700 rounded-3xl p-6 max-w-md w-full relative shadow-2xl">
                <button 
                  onClick={() => setShowEditPlanModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <h3 className="text-xl font-black text-white mb-4">✏️ Editar Meta</h3>
                <form onSubmit={handleSaveEditPlan} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-1 font-bold">Nombre de la Meta</label>
                    <input 
                      type="text" 
                      value={editTitle}
                      onChange={e => setEditTitle(e.target.value)}
                      required
                      className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Monto Meta ($)</label>
                      <input 
                        type="number" 
                        value={editTarget}
                        onChange={e => setEditTarget(e.target.value)}
                        required
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Total de Pasos / Semanas</label>
                      <input 
                        type="number" 
                        value={editPeriods}
                        onChange={e => setEditPeriods(e.target.value)}
                        required
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Frecuencia</label>
                      <select 
                        value={editFreq}
                        onChange={e => setEditFreq(e.target.value)}
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      >
                        <option value="diario">Diaria</option>
                        <option value="semanal">Semanal</option>
                        <option value="quincenal">Quincenal</option>
                        <option value="mensual">Mensual</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1 font-bold">Nombre Pareja</label>
                      <input 
                        type="text" 
                        value={editPartner}
                        onChange={e => setEditPartner(e.target.value)}
                        className="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-[#48E5C2]"
                      />
                    </div>
                  </div>
                  <button 
                    type="submit"
                    className="w-full py-3 rounded-xl bg-[#48E5C2] text-[#0B132B] font-black text-xs hover:opacity-90 transition mt-2"
                  >
                    Guardar Cambios
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Ruleta */}
          {showRoulette && plan && (
            <div className="fixed inset-0 z-50 bg-[#0B132B]/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1C2541] border border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl">
                <button 
                  onClick={() => setShowRoulette(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <div className="text-3xl mb-2">🎲</div>
                <h3 className="text-xl font-black text-white">Ruleta de la Suerte</h3>
                <p className="text-xs text-slate-300 mt-1 mb-4">Meta: <span className="text-[#48E5C2] font-bold">{plan.title}</span></p>

                <div className="bg-[#0B132B] border-2 border-[#FFD166]/40 rounded-2xl p-5 my-4 min-h-[120px] flex flex-col justify-center items-center">
                  {rouletteResult ? (
                    <div>
                      <span className="text-[10px] font-bold uppercase text-[#FFD166]">Número Asignado</span>
                      <p className="text-3xl font-black text-white">#{rouletteResult.period}</p>
                      <p className="text-xl font-black text-[#48E5C2]">${rouletteResult.amount.toLocaleString()}</p>
                    </div>
                  ) : (
                    <p className="text-xs text-slate-400">Presiona el botón para seleccionar un monto al azar</p>
                  )}
                </div>

                {!rouletteResult || isSpinning ? (
                  <button 
                    onClick={spinRoulette}
                    disabled={isSpinning}
                    className="w-full py-3 rounded-xl bg-[#FFD166] text-[#0B132B] font-black text-xs hover:opacity-90 transition disabled:opacity-50"
                  >
                    {isSpinning ? '¡Girando...!' : '¡Girar Ruleta Ahora!'}
                  </button>
                ) : (
                  <div className="space-y-2">
                    <p className="text-[11px] text-slate-300 font-bold mb-1">¿Quién pagará este número?</p>
                    <div className="grid grid-cols-2 gap-2">
                      <button 
                        onClick={() => markRoulettePaid('Yo')}
                        className="py-2.5 rounded-xl bg-[#48E5C2] text-[#0B132B] font-extrabold text-xs hover:opacity-90 transition"
                      >
                        Lo Pago Yo 🙋‍♂️
                      </button>
                      <button 
                        onClick={() => markRoulettePaid(plan.partnerName)}
                        className="py-2.5 rounded-xl bg-pink-400 text-[#0B132B] font-extrabold text-xs hover:opacity-90 transition"
                      >
                        {plan.partnerName} 💖
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AhorroPro - Pareja & Nube</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="font-sans pb-12 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Configuración de tu Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCOvzp1DFR6XGzrmdgS3-c2htcwKuBgIk",
      authDomain: "ahorropro-bcc1c.firebaseapp.com",
      projectId: "ahorropro-bcc1c",
      storageBucket: "ahorropro-bcc1c.appspot.com",
      messagingSenderId: "1086972967689",
      appId: "1:1086972967689:web:6c52bad82df6b094253968"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const initialPlans = [
      {
        id: 'plan-1',
        title: 'Viaje Tijuana 🏖️',
        targetAmount: 6000,
        frequency: 'semanal',
        payDay: 'Viernes',
        totalPeriods: 24,
        isGroup: true,
        person1Name: 'Hector',
        person2Name: 'Pau 💕',
        reward: 'Cena romántica y fin de semana en la playa 🌅',
        steps: Array.from({ length: 24 }, (_, i) => {
          const num = i + 1;
          const amount = num * 20;
          return { 
            period: num, 
            amount, 
            isPaid: false, 
            paidBy: null,
            paidDate: null,
            receipt: null
          };
        })
      }
    ];

    const themes = {
      dark: {
        name: '🌙 Oscuro',
        body: 'bg-[#0B132B] text-slate-100',
        card: 'bg-[#1C2541] border-slate-700',
        cardSub: 'bg-[#0B132B] border-slate-800',
        accentText: 'text-[#48E5C2]',
        accentBg: 'bg-[#48E5C2]',
        accentBorder: 'border-[#48E5C2]',
        modalBg: 'bg-[#0B132B]/80',
        inputBg: 'bg-[#0B132B] text-white border-slate-700'
      },
      light: {
        name: '☀️ Claro',
        body: 'bg-slate-100 text-slate-800',
        card: 'bg-white border-slate-200 shadow-xl',
        cardSub: 'bg-slate-50 border-slate-200',
        accentText: 'text-emerald-600',
        accentBg: 'bg-emerald-500',
        accentBorder: 'border-emerald-500',
        modalBg: 'bg-slate-900/60 backdrop-blur-md',
        inputBg: 'bg-white text-slate-800 border-slate-300'
      }
    };

    const daysOfWeek = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

    function App() {
      const [plans, setPlans] = useState(initialPlans);
      const [selectedPlanId, setSelectedPlanId] = useState(null);
      const [currentThemeKey, setCurrentThemeKey] = useState(() => localStorage.getItem('ahorro_theme') || 'dark');
      const theme = themes[currentThemeKey] || themes.dark;

      const [activeTab, setActiveTab] = useState('grid');
      const [showRoulette, setShowRoulette] = useState(false);
      const [rouletteResult, setRouletteResult] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [showNewPlanModal, setShowNewPlanModal] = useState(false);
      const [showEditPlanModal, setShowEditPlanModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [copied, setCopied] = useState(false);
      const [isCloudConnected, setIsCloudConnected] = useState(false);
      const [notificationsEnabled, setNotificationsEnabled] = useState(false);

      const [selectedStepToPay, setSelectedStepToPay] = useState(null);
      const [activeReceiptStep, setActiveReceiptStep] = useState(null);

      // Formularios Nueva Meta
      const [newTitle, setNewTitle] = useState('');
      const [newTarget, setNewTarget] = useState('6000');
      const [newPeriods, setNewPeriods] = useState('24');
      const [newFreq, setNewFreq] = useState('semanal');
      const [newPayDay, setNewPayDay] = useState('Viernes');
      const [newIsGroup, setNewIsGroup] = useState(true);
      const [newPerson1, setNewPerson1] = useState('Hector');
      const [newPerson2, setNewPerson2] = useState('Pau 💕');
      const [newReward, setNewReward] = useState('');

      // Formularios Editar Meta
      const [editTitle, setEditTitle] = useState('');
      const [editTarget, setEditTarget] = useState('');
      const [editPeriods, setEditPeriods] = useState('');
      const [editFreq, setEditFreq] = useState('semanal');
      const [editPayDay, setEditPayDay] = useState('Viernes');
      const [editIsGroup, setEditIsGroup] = useState(true);
      const [editPerson1, setEditPerson1] = useState('');
      const [editPerson2, setEditPerson2] = useState('');
      const [editReward, setEditReward] = useState('');

      const toggleTheme = () => {
        const nextKey = currentThemeKey === 'dark' ? 'light' : 'dark';
        setCurrentThemeKey(nextKey);
        localStorage.setItem('ahorro_theme', nextKey);
        document.body.className = `${themes[nextKey].body} font-sans pb-12 transition-colors duration-300`;
      };

      useEffect(() => {
        document.body.className = `${theme.body} font-sans pb-12 transition-colors duration-300`;
        if (window.Notification && Notification.permission === 'granted') {
          setNotificationsEnabled(true);
        }

        // Sincronización en tiempo real con Firebase Cloud
        const plansRef = db.ref('ahorro_plans');
        plansRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setPlans(data);
            setIsCloudConnected(true);
          } else {
            // Si está vacío en la nube, subimos los iniciales
            plansRef.set(initialPlans);
            setPlans(initialPlans);
            setIsCloudConnected(true);
          }
        }, (error) => {
          setIsCloudConnected(false);
        });

        return () => plansRef.off();
      }, []);

      const requestNotificationPermission = () => {
        if (!window.Notification) {
          alert('Tu navegador no soporta notificaciones.');
          return;
        }
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            setNotificationsEnabled(true);
            new Notification('¡AhorroPro Activado! 🚀', { body: 'Alertas configuradas correctamente.' });
          } else {
            alert('Permiso de notificaciones denegado.');
          }
        });
      };

      const syncPlans = (newPlans) => {
        setPlans(newPlans);
        db.ref('ahorro_plans').set(newPlans);
      };

      const plan = plans.find(p => p.id === selectedPlanId) || null;
      const paidSteps = plan ? plan.steps.filter(s => s.isPaid) : [];
      const saved = paidSteps.reduce((acc, s) => acc + s.amount, 0);
      const progress = plan ? ((saved / plan.targetAmount) * 100).toFixed(1) : 0;
      const isCompleted = plan && saved >= plan.targetAmount;

      const p1Total = plan ? paidSteps.filter(s => s.paidBy === plan.person1Name).reduce((acc, s) => acc + s.amount, 0) : 0;
      const p2Total = (plan && plan.isGroup) ? paidSteps.filter(s => s.paidBy === plan.person2Name).reduce((acc, s) => acc + s.amount, 0) : 0;

      const handleOpenEdit = () => {
        if (!plan) return;
        setEditTitle(plan.title);
        setEditTarget(plan.targetAmount.toString());
        setEditPeriods(plan.totalPeriods.toString());
        setEditFreq(plan.frequency);
        setEditPayDay(plan.payDay || 'Viernes');
        setEditIsGroup(plan.isGroup);
        setEditPerson1(plan.person1Name || 'Hector');
        setEditPerson2(plan.person2Name || 'Pau 💕');
        setEditReward(plan.reward || '');
        setShowEditPlanModal(true);
      };

      const handleStepClick = (step) => {
        if (step.isPaid) {
          togglePaid(step.period, false, null, null);
        } else {
          if (!plan.isGroup) {
            togglePaid(step.period, true, plan.person1Name, null);
          } else {
            setSelectedStepToPay(step);
          }
        }
      };

      const togglePaid = (periodNum, isPaidStatus, paidByPayer, receiptData = null) => {
        const currentDate = new Date().toLocaleDateString();
        const updatedSteps = plan.steps.map(s => {
          if (s.period === periodNum) {
            return { 
              ...s, 
              isPaid: isPaidStatus, 
              paidBy: isPaidStatus ? paidByPayer : null,
              paidDate: isPaidStatus ? currentDate : null,
              receipt: isPaidStatus ? (receiptData !== null ? receiptData : s.receipt) : null
            };
          }
          return s;
        });
        const updatedPlans = plans.map(p => p.id === plan.id ? { ...p, steps: updatedSteps } : p);
        syncPlans(updatedPlans);
      };

      const confirmPayerForStep = (payer) => {
        if (!selectedStepToPay) return;
        togglePaid(selectedStepToPay.period, true, payer, null);
        setSelectedStepToPay(null);
      };

      const markRoulettePaid = (payer) => {
        if (!rouletteResult) return;
        togglePaid(rouletteResult.period, true, payer, null);
        setShowRoulette(false);
        setRouletteResult(null);
      };

      const handleImageUpload = (e, periodNum) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64String = reader.result;
          const updatedSteps = plan.steps.map(s => {
            if (s.period === periodNum) {
              return { ...s, receipt: base64String };
            }
            return s;
          });
          const updatedPlans = plans.map(p => p.id === plan.id ? { ...p, steps: updatedSteps } : p);
          syncPlans(updatedPlans);
          if (activeReceiptStep && activeReceiptStep.period === periodNum) {
            setActiveReceiptStep({ ...activeReceiptStep, receipt: base64String });
          }
        };
        reader.readAsDataURL(file);
      };

      const deletePlan = (planIdToDelete) => {
        const targetPlan = plans.find(p => p.id === planIdToDelete);
        if (confirm(`¿Estás seguro de eliminar la meta "${targetPlan?.title}"?`)) {
          const filtered = plans.filter(p => p.id !== planIdToDelete);
          syncPlans(filtered);
          setSelectedPlanId(null);
        }
      };

      const deleteAllPlans = () => {
        if (confirm('⚠️ ¿Quieres eliminar TODAS las metas creadas?')) {
          syncPlans([]);
          setSelectedPlanId(null);
        }
      };

      const handleCreatePlan = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        const periods = parseInt(newPeriods) || 30;
        const target = parseFloat(newTarget) || 5000;
        const baseStep = (target * 2) / (periods * (periods + 1));
        
        const steps = Array.from({ length: periods }, (_, i) => {
          const num = i + 1;
          const calculated = Math.round(baseStep * num / 5) * 5;
          return {
            period: num,
            amount: calculated > 0 ? calculated : 10,
            isPaid: false,
            paidBy: null,
            paidDate: null,
            receipt: null
          };
        });

        const newPlan = {
          id: 'plan-' + Date.now(),
          title: newTitle,
          targetAmount: target,
          frequency: newFreq,
          payDay: newPayDay,
          totalPeriods: periods,
          isGroup: newIsGroup,
          person1Name: newPerson1 || 'Hector',
          person2Name: newIsGroup ? (newPerson2 || 'Pau 💕') : null,
          reward: newReward.trim() || '¡Meta cumplida con éxito! 🎉',
          steps: steps
        };

        const updatedPlans = [...plans, newPlan];
        syncPlans(updatedPlans);
        setSelectedPlanId(newPlan.id);
        setShowNewPlanModal(false);
        setNewTitle('');
        setNewReward('');
      };

      const handleSaveEditPlan = (e) => {
        e.preventDefault();
        if (!editTitle.trim()) return;

        const periods = parseInt(editPeriods) || 30;
        const target = parseFloat(editTarget) || 5000;
        const baseStep = (target * 2) / (periods * (periods + 1));

        const updatedSteps = Array.from({ length: periods }, (_, i) => {
          const num = i + 1;
          const existingStep = plan.steps.find(s => s.period === num);
          const calculated = Math.round(baseStep * num / 5) * 5;

          return {
            period: num,
            amount: existingStep ? existingStep.amount : (calculated > 0 ? calculated : 10),
            isPaid: existingStep ? existingStep.isPaid : false,
            paidBy: existingStep ? existingStep.paidBy : null,
            paidDate: existingStep ? existingStep.paidDate : null,
            receipt: existingStep ? existingStep.receipt : null
          };
        });

        const updatedPlans = plans.map(p => {
          if (p.id === plan.id) {
            return {
              ...p,
              title: editTitle,
              targetAmount: target,
              totalPeriods: periods,
              frequency: editFreq,
              payDay: editPayDay,
              isGroup: editIsGroup,
              person1Name: editPerson1 || 'Hector',
              person2Name: editIsGroup ? (editPerson2 || 'Pau 💕') : null,
              reward: editReward.trim() || '¡Meta cumplida con éxito! 🎉',
              steps: updatedSteps
            };
          }
          return p;
        });

        syncPlans(updatedPlans);
        setShowEditPlanModal(false);
      };

      const spinRoulette = () => {
        const available = plan.steps.filter(s => !s.isPaid);
        if (available.length === 0) return;
        setIsSpinning(true);
        let counter = 0;
        const interval = setInterval(() => {
          const rand = available[Math.floor(Math.random() * available.length)];
          setRouletteResult(rand);
          counter++;
          if (counter > 15) {
            clearInterval(interval);
            setIsSpinning(false);
          }
        }, 100);
      };

      return (
        <div className="max-w-4xl mx-auto px-4 pt-6 space-y-6">
          {/* Header Global */}
          <header className={`flex justify-between items-center ${theme.card} p-5 rounded-2xl border shadow-xl flex-wrap gap-3`}>
            <div className="flex items-center gap-3">
              <div className={`w-10 h-10 rounded-xl ${theme.accentBg} flex items-center justify-center text-slate-900 font-black text-xl`}>
                $
              </div>
              <div>
                <h1 className="text-xl font-extrabold">Ahorro<span className={theme.accentText}>Pro</span></h1>
                <p className="text-xs opacity-75">Nube & Tiempo Real ☁️⚡</p>
              </div>
            </div>
            
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={requestNotificationPermission}
                className={`px-3 py-2 rounded-xl border text-xs font-bold transition flex items-center gap-1 ${
                  notificationsEnabled 
                    ? 'bg-emerald-500/20 text-emerald-500 border-emerald-500/40' 
                    : 'bg-amber-400/20 text-amber-500 border-amber-400/40 hover:bg-amber-400/30'
                }`}
              >
                {notificationsEnabled ? '🔔 Alertas' : '🔕 Alertas'}
              </button>

              <button
                onClick={toggleTheme}
                className={`px-3.5 py-2 rounded-xl border text-xs font-bold transition ${
                  currentThemeKey === 'dark' 
                    ? 'bg-slate-800 text-slate-200 border-slate-700 hover:bg-slate-700' 
                    : 'bg-slate-200 text-slate-800 border-slate-300 hover:bg-slate-300'
                }`}
              >
                {currentThemeKey === 'dark' ? '☀️ Claro' : '🌙 Oscuro'}
              </button>

              <span className={`px-3 py-1.5 rounded-full text-xs font-bold border ${
                isCloudConnected 
                  ? 'bg-emerald-500/20 text-emerald-500 border-emerald-500/40' 
                  : 'bg-amber-500/20 text-amber-500 border-amber-500/40'
              }`}>
                {isCloudConnected ? '☁️ En Línea (Nube)' : '⏳ Conectando...'}
              </span>
            </div>
          </header>

          {/* ==================================================== */}
          {/* PANTALLA DE INICIO (DASHBOARD) */}
          {/* ==================================================== */}
          {!selectedPlanId && (
            <div className="space-y-6">
              <div className="flex justify-between items-center flex-wrap gap-3">
                <div>
                  <h2 className="text-2xl font-black">Panel de Metas 🎯</h2>
                  <p className="text-xs opacity-75">Tus metas sincronizadas automáticamente en la nube.</p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setShowNewPlanModal(true)}
                    className={`px-4 py-2.5 rounded-xl ${theme.accentBg} text-slate-900 font-black text-xs hover:opacity-90 transition shadow-md`}
                  >
                    + Crear Nueva Meta
                  </button>
                  {plans.length > 0 && (
                    <button
                      onClick={deleteAllPlans}
                      className="px-3.5 py-2.5 rounded-xl bg-red-500/10 text-red-500 border border-red-500/20 text-xs font-bold hover:bg-red-500/20 transition"
                    >
                      🗑️ Borrar Todas
                    </button>
                  )}
                </div>
              </div>

              {plans.length === 0 && (
                <div className={`${theme.card} p-10 rounded-3xl border text-center space-y-4 shadow-2xl my-6`}>
                  <div className={`w-20 h-20 ${theme.accentBg}/10 ${theme.accentText} border ${theme.accentBorder}/30 rounded-full flex items-center justify-center mx-auto text-4xl`}>
                    🎯
                  </div>
                  <h3 className="text-xl font-black">¡No tienes metas creadas!</h3>
                  <p className="text-sm opacity-75 max-w-md mx-auto">
                    Comienza agregando tu primera meta de ahorro.
                  </p>
                  <button
                    onClick={() => setShowNewPlanModal(true)}
                    className={`px-6 py-3.5 rounded-2xl ${theme.accentBg} text-slate-900 font-black text-sm hover:opacity-90 transition shadow-lg inline-block`}
                  >
                    + Crear Mi Primera Meta Ahora
                  </button>
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {plans.map(p => {
                  const pPaidSteps = p.steps.filter(s => s.isPaid);
                  const pSaved = pPaidSteps.reduce((acc, s) => acc + s.amount, 0);
                  const pProgress = ((pSaved / p.targetAmount) * 100).toFixed(1);
                  const pCompleted = pSaved >= p.targetAmount;

                  return (
                    <div 
                      key={p.id}
                      onClick={() => setSelectedPlanId(p.id)}
                      className={`${theme.card} p-5 rounded-3xl border shadow-lg hover:border-emerald-400 transition cursor-pointer flex flex-col justify-between space-y-4 relative group`}
                    >
                      <div>
                        <div className="flex justify-between items-start gap-2">
                          <h3 className="text-lg font-black group-hover:text-emerald-400 transition">{p.title}</h3>
                          <span className="px-2.5 py-0.5 rounded-full bg-black/10 dark:bg-slate-800 border border-current opacity-75 text-[10px] font-bold">
                            {p.isGroup ? '👥 Pareja' : '👤 Individual'}
                          </span>
                        </div>
                        <p className="text-xs opacity-75 mt-1">Cobro: {p.frequency} ({p.payDay || 'N/A'})</p>
                      </div>

                      <div className="space-y-1">
                        <div className="flex justify-between items-center text-xs font-bold">
                          <span>Ahorrado: ${pSaved.toLocaleString()}</span>
                          <span className={theme.accentText}>{pProgress}%</span>
                        </div>
                        <div className={`w-full ${theme.cardSub} h-2.5 rounded-full overflow-hidden border`}>
                          <div 
                            className={`h-full transition-all duration-500 ${pCompleted ? 'bg-emerald-500' : 'bg-gradient-to-r from-emerald-400 to-amber-400'}`}
                            style={{ width: `${Math.min(pProgress, 100)}%` }}
                          ></div>
                        </div>
                      </div>

                      <div className="flex justify-between items-center pt-2 border-t opacity-90 text-xs">
                        <span className="opacity-75">Meta: ${p.targetAmount.toLocaleString()}</span>
                        <span className={`${theme.accentText} font-bold flex items-center gap-1`}>
                          Entrar al contador →
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ==================================================== */}
          {/* VISTA DEL CONTADOR (DETALLE DE LA META) */}
          {/* ==================================================== */}
          {selectedPlanId && plan && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <button
                  onClick={() => setSelectedPlanId(null)}
                  className={`px-4 py-2 rounded-xl ${theme.card} border text-xs font-bold flex items-center gap-2 hover:opacity-100 opacity-80 transition`}
                >
                  ← Volver a Mis Metas
                </button>
                <span className="text-xs opacity-75 font-semibold">Meta Activa: <strong className={theme.accentText}>{plan.title}</strong></span>
              </div>

              <div className={`${theme.card} p-6 rounded-3xl border shadow-2xl space-y-4 transition-all duration-500`}>
                
                {isCompleted && (
                  <div className="bg-emerald-500/20 border border-emerald-500/50 p-5 rounded-2xl text-center space-y-3 animate-pulse">
                    <div>
                      <span className="text-3xl">🏆🎉</span>
                      <h3 className="text-xl font-black text-emerald-600 dark:text-emerald-300 mt-1">¡META COMPLETADA AL 100%!</h3>
                      <p className="text-xs opacity-75 mt-1">
                        ¡Felicidades <span className={theme.accentText}>{plan.person1Name}</span> {plan.isGroup ? `y ${plan.person2Name}` : ''}! Ya pueden reclamar su premio:
                      </p>
                      <p className="text-sm font-black text-amber-500 pt-1">🎁 {plan.reward}</p>
                    </div>

                    <div className="pt-2 border-t border-emerald-500/30 flex justify-center">
                      <button
                        onClick={() => deletePlan(plan.id)}
                        className="px-5 py-2.5 rounded-xl bg-red-500 text-white font-black text-xs hover:bg-red-600 shadow-lg transition flex items-center gap-2"
                      >
                        🗑️ Eliminar Meta Completada (Cerrar Reto)
                      </button>
                    </div>
                  </div>
                )}

                <div className="flex justify-between items-center flex-wrap gap-2">
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <h2 className="text-2xl font-black">{plan.title}</h2>
                      <span className="px-2.5 py-0.5 rounded-full bg-black/10 dark:bg-slate-800 border border-current opacity-75 text-[10px] font-bold">
                        {plan.isGroup ? '👥 Pareja / Grupo' : '👤 Individual'}
                      </span>
                      <button
                        onClick={handleOpenEdit}
                        className="p-1.5 rounded-lg bg-black/10 dark:bg-slate-800 hover:opacity-100 opacity-75 border text-xs transition"
                        title="Editar"
                      >
                        ✏️ Editar
                      </button>
                      <button
                        onClick={() => deletePlan(plan.id)}
                        className="p-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/20 text-xs transition"
                        title="Eliminar"
                      >
                        🗑️
                      </button>
                    </div>
                    <p className="text-xs opacity-75 mt-0.5">Cobro: {plan.frequency} ({plan.payDay || 'N/A'}) • {plan.totalPeriods} periodos</p>
                  </div>

                  {!isCompleted && (
                    <button 
                      onClick={() => { setShowRoulette(true); setRouletteResult(null); }}
                      className="px-4 py-2.5 rounded-xl bg-amber-400 text-slate-900 font-extrabold text-xs flex items-center gap-2 shadow-lg hover:scale-105 transition"
                    >
                      🎲 ¡Girar Ruleta!
                    </button>
                  )}
                </div>

                <div className={`w-full ${theme.cardSub} h-3 rounded-full overflow-hidden border`}>
                  <div 
                    className={`h-full transition-all duration-500 ${isCompleted ? 'bg-emerald-500' : 'bg-gradient-to-r from-emerald-400 to-amber-400'}`}
                    style={{ width: `${Math.min(progress, 100)}%` }}
                  ></div>
                </div>

                {!isCompleted && plan.reward && (
                  <div className={`${theme.cardSub} p-3 rounded-2xl border border-amber-500/30 flex items-center gap-3`}>
                    <div className="text-xl">🎁</div>
                    <div className="text-xs">
                      <span className="font-bold text-amber-500 uppercase tracking-wide">Premio al completar:</span>
                      <p className="opacity-95 font-medium">{plan.reward}</p>
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-1">
                  <div className={`${theme.cardSub} p-3 rounded-2xl border`}>
                    <p className="text-[11px] opacity-75">Total Ahorrado</p>
                    <p className={`text-xl font-black ${theme.accentText}`}>${saved.toLocaleString()}</p>
                  </div>
                  <div className={`${theme.cardSub} p-3 rounded-2xl border`}>
                    <p className="text-[11px] opacity-75">Meta Objetiva</p>
                    <p className="text-xl font-black">${plan.targetAmount.toLocaleString()}</p>
                  </div>
                  <div className={`${theme.cardSub} p-3 rounded-2xl border col-span-2 sm:col-span-1`}>
                    <p className="text-[11px] opacity-75">Progreso Total</p>
                    <p className="text-xl font-black text-amber-500">{progress}%</p>
                  </div>
                </div>

                <div className="pt-2 border-t opacity-90">
                  <p className="text-xs font-bold opacity-75 mb-2">Aportes por Integrante:</p>
                  <div className={`grid gap-3 ${plan.isGroup ? 'grid-cols-2' : 'grid-cols-1'}`}>
                    <div className={`${theme.cardSub} p-3 rounded-xl border border-cyan-500/30`}>
                      <span className="text-[10px] text-cyan-500 font-bold uppercase">{plan.person1Name}</span>
                      <p className="text-lg font-black">${p1Total.toLocaleString()}</p>
                    </div>
                    {plan.isGroup && (
                      <div className={`${theme.cardSub} p-3 rounded-xl border border-pink-500/30`}>
                        <span className="text-[10px] text-pink-500 font-bold uppercase">{plan.person2Name}</span>
                        <p className="text-lg font-black">${p2Total.toLocaleString()}</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="flex gap-2 border-b opacity-80 pb-2">
                <button
                  onClick={() => setActiveTab('grid')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                    activeTab === 'grid'
                      ? `${theme.card} ${theme.accentText} border shadow-md`
                      : 'opacity-70 hover:opacity-100'
                  }`}
                >
                  📅 Calendario de Aportes
                </button>
                <button
                  onClick={() => setActiveTab('history')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                    activeTab === 'history'
                      ? `${theme.card} text-amber-500 border shadow-md`
                      : 'opacity-70 hover:opacity-100'
                  }`}
                >
                  📜 Historial ({paidSteps.length})
                </button>
              </div>

              {activeTab === 'grid' && (
                <div className="space-y-3">
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                    {plan.steps.map(step => (
                      <div 
                        key={step.period}
                        onClick={() => handleStepClick(step)}
                        className={`p-3.5 rounded-2xl border transition cursor-pointer flex flex-col justify-between ${
                          step.isPaid 
                            ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-600 dark:text-emerald-300' 
                            : `${theme.card} hover:border-emerald-400`
                        }`}
                      >
                        <div className="flex justify-between items-center text-xs font-bold">
                          <span>#{step.period}</span>
                          <span>{step.isPaid ? '✓' : '○'}</span>
                        </div>
                        <p className="text-lg font-black my-2">${step.amount.toLocaleString()}</p>
                        <div className="flex justify-between items-center text-[10px] opacity-75 mt-1">
                          <span>{step.isPaid ? `Pagado (${step.paidBy})` : 'Toca para marcar'}</span>
                          {step.isPaid && step.receipt && <span className={`${theme.accentText} font-bold`}>📷 View</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'history' && (
                <div className={`${theme.card} p-5 rounded-3xl border space-y-3 shadow-xl`}>
                  <h3 className="text-sm font-bold mb-2">Registro Cronológico de Pagos</h3>
                  {paidSteps.length === 0 ? (
                    <p className="text-xs opacity-75 py-6 text-center">Aún no hay aportes registrados en esta meta.</p>
                  ) : (
                    <div className="space-y-2">
                      {paidSteps.slice().reverse().map(step => (
                        <div key={step.period} className={`flex justify-between items-center ${theme.cardSub} p-3.5 rounded-2xl border text-xs flex-wrap gap-3`}>
                          <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-500 flex items-center justify-center font-black">
                              ✓
                            </div>
                            <div>
                              <p className="font-extrabold">Casilla #{step.period} - ${step.amount.toLocaleString()}</p>
                              <p className="text-[10px] opacity-75">Pagado por <span className={`${theme.accentText} font-bold`}>{step.paidBy}</span> {step.paidDate ? `el ${step.paidDate}` : ''}</p>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => setActiveReceiptStep(step)}
                              className={`px-3 py-1.5 rounded-xl font-bold text-xs transition border ${
                                step.receipt 
                                  ? `${theme.accentBg}/20 ${theme.accentText} border-current` 
                                  : 'bg-black/10 dark:bg-slate-800 border-current opacity-75'
                              }`}
                            >
                              {step.receipt ? '📷 View (Con Foto)' : '📷 View'}
                            </button>

                            <button
                              onClick={() => togglePaid(step.period, false, null, null)}
                              className="px-2.5 py-1.5 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500/20 font-bold transition text-[10px]"
                              title="Deshacer"
                            >
                              Deshacer
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* ==================================================== */}
          {/* MODALES */}
          {/* ==================================================== */}
          {activeReceiptStep && (
            <div className={`fixed inset-0 z-50 ${theme.modalBg} flex items-center justify-center p-4`}>
              <div className={`${theme.card} border rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl space-y-4`}>
                <button onClick={() => setActiveReceiptStep(null)} className="absolute top-4 right-4 opacity-70 hover:opacity-100 font-bold">✕</button>
                <div>
                  <span className={`text-[10px] font-bold uppercase ${theme.accentText}`}>Comprobante de Pago</span>
                  <h3 className="text-xl font-black mt-0.5">Casilla #{activeReceiptStep.period} (${activeReceiptStep.amount.toLocaleString()})</h3>
                  <p className="text-xs opacity-75">Aportado por {activeReceiptStep.paidBy}</p>
                </div>
                <div className={`${theme.cardSub} border rounded-2xl p-3 min-h-[160px] flex flex-col justify-center items-center overflow-hidden`}>
                  {activeReceiptStep.receipt ? (
                    <div className="space-y-3 w-full">
                      <img src={activeReceiptStep.receipt} alt="Comprobante" className="max-h-48 rounded-xl mx-auto object-contain border" />
                      <label className="inline-block px-3 py-1.5 bg-black/10 dark:bg-slate-800 text-xs font-bold rounded-xl cursor-pointer transition border">
                        Cambiar foto
                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, activeReceiptStep.period)} className="hidden" />
                      </label>
                    </div>
                  ) : (
                    <div className="space-y-3 py-4">
                      <p className="text-xs opacity-75">No hay comprobante adjunto todavía.</p>
                      <label className={`inline-block px-4 py-2.5 ${theme.accentBg} text-slate-900 text-xs font-black rounded-xl cursor-pointer shadow-md hover:opacity-90 transition`}>
                        Subir Comprobante 📁
                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, activeReceiptStep.period)} className="hidden" />
                      </label>
                    </div>
                  )}
                </div>
                <button onClick={() => setActiveReceiptStep(null)} className="w-full py-2.5 rounded-xl bg-black/10 dark:bg-slate-800 font-bold text-xs hover:opacity-80 transition">Cerrar</button>
              </div>
            </div>
          )}

          {selectedStepToPay && plan && (
            <div className={`fixed inset-0 z-50 ${theme.modalBg} flex items-center justify-center p-4`}>
              <div className={`${theme.card} border rounded-3xl p-6 max-w-xs w-full text-center relative shadow-2xl space-y-4`}>
                <button onClick={() => setSelectedStepToPay(null)} className="absolute top-4 right-4 opacity-70 hover:opacity-100 font-bold">✕</button>
                <div>
                  <span className={`text-[10px] font-bold uppercase ${theme.accentText}`}>Marcar Número #{selectedStepToPay.period}</span>
                  <p className="text-2xl font-black mt-1">${selectedStepToPay.amount.toLocaleString()}</p>
                  <p className="text-xs opacity-75 mt-2">¿Quién aporta esta cantidad?</p>
                </div>
                <div className="grid grid-cols-1 gap-2 pt-2">
                  <button onClick={() => confirmPayerForStep(plan.person1Name)} className={`py-3 rounded-xl ${theme.accentBg} text-slate-900 font-extrabold text-xs hover:opacity-90 transition`}>
                    {plan.person1Name} 🙋‍♂️
                  </button>
                  {plan.isGroup && (
                    <button onClick={() => confirmPayerForStep(plan.person2Name)} className="py-3 rounded-xl bg-pink-500 text-white font-extrabold text-xs hover:opacity-90 transition">
                      {plan.person2Name} 💖
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Crear Nueva Meta */}
          {showNewPlanModal && (
            <div className={`fixed inset-0 z-50 ${theme.modalBg} flex items-center justify-center p-4`}>
              <div className={`${theme.card} border rounded-3xl p-6 max-w-md w-full relative shadow-2xl max-h-[90vh] overflow-y-auto`}>
                <button onClick={() => setShowNewPlanModal(false)} className="absolute top-4 right-4 opacity-70 hover:opacity-100 font-bold">✕</button>
                <h3 className="text-xl font-black mb-4">🎯 Crear Nueva Meta de Ahorro</h3>
                <form onSubmit={handleCreatePlan} className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 font-bold">Nombre de la Meta</label>
                    <input type="text" placeholder="Ej. Viaje Tijuana 🏖️" value={newTitle} onChange={e => setNewTitle(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3 focus:outline-none`} />
                  </div>

                  <div>
                    <label className="block mb-1 font-bold">🎁 Premio o Recompensa al Completar</label>
                    <input type="text" placeholder="Ej. Cena romántica o fin de semana 🌅" value={newReward} onChange={e => setNewReward(e.target.value)} className={`w-full ${theme.inputBg} border rounded-xl p-3 focus:outline-none`} />
                  </div>

                  <div>
                    <label className="block mb-1 font-bold">Frecuencia</label>
                    <select value={newFreq} onChange={e => {
                      setNewFreq(e.target.value);
                      if(e.target.value === 'semanal') setNewPayDay('Viernes');
                      else if(e.target.value === 'quincenal') setNewPayDay('Quincenal (15 y 30)');
                      else if(e.target.value === 'mensual') setNewPayDay('Mensual (Fin de mes)');
                      else setNewPayDay('Diario');
                    }} className={`w-full ${theme.inputBg} border rounded-xl p-3`}>
                      <option value="diario">Diaria</option>
                      <option value="semanal">Semanal</option>
                      <option value="quincenal">Quincenal</option>
                      <option value="mensual">Mensual</option>
                    </select>
                  </div>

                  {newFreq === 'semanal' ? (
                    <div>
                      <label className="block mb-1 font-bold">Día de la semana para ahorrar</label>
                      <div className="grid grid-cols-4 gap-2 pt-1">
                        {daysOfWeek.map(day => (
                          <button
                            key={day}
                            type="button"
                            onClick={() => setNewPayDay(day)}
                            className={`py-2 px-1 rounded-xl font-bold text-center border transition text-[11px] ${
                              newPayDay === day 
                                ? `${theme.accentBg} text-slate-900 border-current shadow-md scale-105` 
                                : `${theme.cardSub} opacity-75 hover:opacity-100`
                            }`}
                          >
                            {day}
                          </button>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div>
                      <label className="block mb-1 font-bold">Detalle de Cobro / Alerta</label>
                      <input type="text" value={newPayDay} onChange={e => setNewPayDay(e.target.value)} className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                  )}

                  <div>
                    <label className="block mb-1 font-bold">Modo de Ahorro</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button type="button" onClick={() => setNewIsGroup(false)} className={`py-2 rounded-xl border text-xs font-bold transition ${!newIsGroup ? `${theme.accentBg} text-slate-900 border-current` : 'bg-black/10 dark:bg-slate-800 opacity-70'}`}>👤 Solo Yo</button>
                      <button type="button" onClick={() => setNewIsGroup(true)} className={`py-2 rounded-xl border text-xs font-bold transition ${newIsGroup ? `${theme.accentBg} text-slate-900 border-current` : 'bg-black/10 dark:bg-slate-800 opacity-70'}`}>👥 Pareja / Grupo</button>
                    </div>
                  </div>

                  <div className={`grid gap-3 ${newIsGroup ? 'grid-cols-2' : 'grid-cols-1'}`}>
                    <div>
                      <label className="block mb-1 font-bold">Persona 1</label>
                      <input type="text" value={newPerson1} onChange={e => setNewPerson1(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                    {newIsGroup && (
                      <div>
                        <label className="block mb-1 font-bold">Persona 2</label>
                        <input type="text" value={newPerson2} onChange={e => setNewPerson2(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block mb-1 font-bold">Monto Meta ($)</label>
                      <input type="number" value={newTarget} onChange={e => setNewTarget(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                    <div>
                      <label className="block mb-1 font-bold">Cantidad de Pasos</label>
                      <input type="number" value={newPeriods} onChange={e => setNewPeriods(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                  </div>

                  <button type="submit" className={`w-full py-3 rounded-xl ${theme.accentBg} text-slate-900 font-black text-xs hover:opacity-90 transition mt-2`}>¡Guardar y Comenzar Meta!</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Editar Meta */}
          {showEditPlanModal && plan && (
            <div className={`fixed inset-0 z-50 ${theme.modalBg} flex items-center justify-center p-4`}>
              <div className={`${theme.card} border rounded-3xl p-6 max-w-md w-full relative shadow-2xl max-h-[90vh] overflow-y-auto`}>
                <button onClick={() => setShowEditPlanModal(false)} className="absolute top-4 right-4 opacity-70 hover:opacity-100 font-bold">✕</button>
                <h3 className="text-xl font-black mb-4">✏️ Editar Meta</h3>
                <form onSubmit={handleSaveEditPlan} className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 font-bold">Nombre de la Meta</label>
                    <input type="text" value={editTitle} onChange={e => setEditTitle(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                  </div>

                  <div>
                    <label className="block mb-1 font-bold">🎁 Premio o Recompensa al Completar</label>
                    <input type="text" value={editReward} onChange={e => setEditReward(e.target.value)} className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                  </div>

                  <div>
                    <label className="block mb-1 font-bold">Frecuencia</label>
                    <select value={editFreq} onChange={e => {
                      setEditFreq(e.target.value);
                      if(e.target.value === 'semanal') setEditPayDay('Viernes');
                    }} className={`w-full ${theme.inputBg} border rounded-xl p-3`}>
                      <option value="diario">Diaria</option>
                      <option value="semanal">Semanal</option>
                      <option value="quincenal">Quincenal</option>
                      <option value="mensual">Mensual</option>
                    </select>
                  </div>

                  {editFreq === 'semanal' ? (
                    <div>
                      <label className="block mb-1 font-bold">Día de la semana para ahorrar</label>
                      <div className="grid grid-cols-4 gap-2 pt-1">
                        {daysOfWeek.map(day => (
                          <button
                            key={day}
                            type="button"
                            onClick={() => setEditPayDay(day)}
                            className={`py-2 px-1 rounded-xl font-bold text-center border transition text-[11px] ${
                              editPayDay === day 
                                ? `${theme.accentBg} text-slate-900 border-current shadow-md scale-105` 
                                : `${theme.cardSub} opacity-75 hover:opacity-100`
                            }`}
                          >
                            {day}
                          </button>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div>
                      <label className="block mb-1 font-bold">Detalle de Cobro / Alerta</label>
                      <input type="text" value={editPayDay} onChange={e => setEditPayDay(e.target.value)} className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                  )}

                  <div>
                    <label className="block mb-1 font-bold">Modo de Ahorro</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button type="button" onClick={() => setEditIsGroup(false)} className={`py-2 rounded-xl border text-xs font-bold transition ${!editIsGroup ? `${theme.accentBg} text-slate-900 border-current` : 'bg-black/10 dark:bg-slate-800 opacity-70'}`}>👤 Solo Yo</button>
                      <button type="button" onClick={() => setEditIsGroup(true)} className={`py-2 rounded-xl border text-xs font-bold transition ${editIsGroup ? `${theme.accentBg} text-slate-900 border-current` : 'bg-black/10 dark:bg-slate-800 opacity-70'}`}>👥 Pareja / Grupo</button>
                    </div>
                  </div>

                  <div className={`grid gap-3 ${editIsGroup ? 'grid-cols-2' : 'grid-cols-1'}`}>
                    <div>
                      <label className="block mb-1 font-bold">Persona 1</label>
                      <input type="text" value={editPerson1} onChange={e => setEditPerson1(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                    {editIsGroup && (
                      <div>
                        <label className="block mb-1 font-bold">Persona 2</label>
                        <input type="text" value={editPerson2} onChange={e => setEditPerson2(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block mb-1 font-bold">Monto Meta ($)</label>
                      <input type="number" value={editTarget} onChange={e => setEditTarget(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                    <div>
                      <label className="block mb-1 font-bold">Total de Pasos / Semanas</label>
                      <input type="number" value={editPeriods} onChange={e => setEditPeriods(e.target.value)} required className={`w-full ${theme.inputBg} border rounded-xl p-3`} />
                    </div>
                  </div>

                  <button type="submit" className={`w-full py-3 rounded-xl ${theme.accentBg} text-slate-900 font-black text-xs hover:opacity-90 transition mt-2`}>Guardar Cambios</button>
                </form>
              </div>
            </div>
          )}

          {showRoulette && plan && (
            <div className={`fixed inset-0 z-50 ${theme.modalBg} flex items-center justify-center p-4`}>
              <div className={`${theme.card} border rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl`}>
                <button onClick={() => setShowRoulette(false)} className="absolute top-4 right-4 opacity-70 hover:opacity-100 font-bold">✕</button>
                <div className="text-3xl mb-2">🎲</div>
                <h3 className="text-xl font-black">Ruleta de la Suerte</h3>
                <p className="text-xs opacity-75 mt-1 mb-4">Meta: <span className={`${theme.accentText} font-bold`}>{plan.title}</span></p>
                <div className={`${theme.cardSub} border-2 border-amber-400/40 rounded-2xl p-5 my-4 min-h-[120px] flex flex-col justify-center items-center`}>
                  {rouletteResult ? (
                    <div>
                      <span className="text-[10px] font-bold uppercase text-amber-500">Número Asignado</span>
                      <p className="text-3xl font-black">#{rouletteResult.period}</p>
                      <p className={`text-xl font-black ${theme.accentText}`}>${rouletteResult.amount.toLocaleString()}</p>
                    </div>
                  ) : (
                    <p className="text-xs opacity-75">Presiona el botón para tirar los dados</p>
                  )}
                </div>
                {!rouletteResult || isSpinning ? (
                  <button onClick={spinRoulette} disabled={isSpinning} className="w-full py-3 rounded-xl bg-amber-400 text-slate-900 font-black text-xs hover:opacity-90 transition disabled:opacity-50">
                    {isSpinning ? '¡Girando...!' : '¡Girar Ruleta Ahora!'}
                  </button>
                ) : (
                  <div className="space-y-2">
                    <p className="text-[11px] opacity-75 font-bold mb-1">¿Quién pagará este número?</p>
                    <div className={`grid gap-2 ${plan.isGroup ? 'grid-cols-2' : 'grid-cols-1'}`}>
                      <button onClick={() => markRoulettePaid(plan.person1Name)} className={`py-2.5 rounded-xl ${theme.accentBg} text-slate-900 font-extrabold text-xs hover:opacity-90 transition`}>
                        {plan.person1Name} 🙋‍♂️
                      </button>
                      {plan.isGroup && (
                        <button onClick={() => markRoulettePaid(plan.person2Name)} className="py-2.5 rounded-xl bg-pink-500 text-white font-extrabold text-xs hover:opacity-90 transition">
                          {plan.person2Name} 💖
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
